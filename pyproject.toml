[project]
name = "ai_chatbot"
authors = [{ name = "Your Company", email = "dev@example.com" }]
description = "Read-only, permission-aware AI chatbot for ERPNext (Arabic, French, English)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
